name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore the previous data snapshot
        run: curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live/snapshot.json" -o data/live/snapshot.json || true
      - name: Refresh reference data
        run: node tools/fetch-live.mjs || true
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html launcher.html boot.js sw.js manifest.webmanifest mirrors.json assets.json CHANGELOG.md .nojekyll css js data icons vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Refresh independent copies
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 45
        run: node tools/publish-mirrors.mjs "v$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
